:root {
  /* ----- Brand & Foreground ----- */
  --hb-black: #0b0707;          /* logo, all headlines, primary text on light */
  --hb-ink: #292929;             /* body copy */
  --hb-ink-soft: #424242;        /* secondary body */
  --hb-gray: #92979b;            /* neutral icons, dividers, disabled */
  --hb-gray-300: #d8d5c9;        /* warm hairline borders */

  /* ----- Brand Orange (CTAs, accents) ----- */
  --hb-orange: #fa5000;          /* primary CTA, the lightning bolt */
  --hb-orange-700: #e33e01;      /* hover */
  --hb-orange-800: #d93f0b;      /* press */
  --hb-orange-500: #f3773e;      /* tint */
  --hb-orange-600: #ec6b1d;      /* tint */
  --hb-orange-50:  #ffeee6;      /* soft orange surface */
  --hb-orange-100: #ffc7ad;      /* orange chip */
  --hb-peach-50:   #feebe7;      /* warm pink wash, used as flavour surface */
  --hb-peach-100:  #f8e0d5;
  --hb-peach-200:  #f8d9cc;

  /* ----- Warm Neutrals (page backgrounds) ----- */
  --hb-cream:      #faf9f6;      /* default page background */
  --hb-cream-2:    #f6f5f1;      /* alternate section */
  --hb-cream-3:    #f5f3eb;      /* warm card */
  --hb-cream-4:    #f2f1ee;
  --hb-cream-5:    #eae8e0;      /* darker warm panel */
  --hb-cream-6:    #e8e0e0;

  /* ----- Flavour Colors ----- */
  --hb-lemon-lime:        #c1d32f;
  --hb-lemon-lime-tint:   #dbe96f;
  --hb-lemon-lime-bg:     #f6f8e8;

  --hb-straw-watermelon:      #f04e5f;
  --hb-straw-watermelon-tint: #ff909b;
  --hb-straw-watermelon-bg:   #feebe7;

  --hb-cherry-lime:       #c02032;
  --hb-cherry-lime-tint:  #f66979;
  --hb-cherry-lime-bg:    #f5e2dc;

  /* ----- Semantic ----- */
  --hb-success: #219653;
  --hb-highlight: #dd247f;   /* "BEST VALUE" badge, accent ribbons */
  --hb-white: #ffffff;

  /* ----- Type Stack ----- */
  --font-display: "Roc Grotesk", "Barlow Condensed", "Oswald", system-ui, sans-serif;
  --font-body: "Helvetica Neue", "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;

  /* ----- Type Scale ----- */
  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-md:   18px;
  --text-lg:   20px;
  --text-xl:   24px;
  --text-2xl:  32px;
  --text-3xl:  40px;
  --text-4xl:  56px;
  --text-5xl:  72px;
  --text-6xl:  96px;   /* hero display */

  /* ----- Spacing ----- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;

  /* ----- Radii ----- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-2xl: 32px;
  --radius-pill: 999px;     /* all primary buttons + chips are pills */

  /* ----- Shadows / Elevation ----- */
  --shadow-card: 0 1px 2px rgba(11, 7, 7, 0.04), 0 8px 24px rgba(11, 7, 7, 0.06);
  --shadow-pop:  0 10px 32px rgba(11, 7, 7, 0.12);
  --shadow-inset-soft: inset 0 0 0 1px rgba(11, 7, 7, 0.06);

  /* ----- Borders ----- */
  --border-hairline: 1px solid rgba(11, 7, 7, 0.08);
  --border-soft:     1px solid var(--hb-cream-5);
  --border-strong:   1.5px solid var(--hb-black);

  /* ----- Motion ----- */
  --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast: 140ms;
  --dur-med:  240ms;
  --dur-slow: 420ms;
}

/* =====================================================================
   Semantic typography
   ---------------------------------------------------------------------
   Roc Grotesk Medium Condensed is used for every display heading and any
   loud editorial type ("Supercharge Your Water", section eyebrows, prices,
   product titles). Helvetica Neue is used for body and UI labels.
   Headlines on the live site are uppercase with tight letter-spacing.
   ===================================================================== */

.hb-eyebrow {
  font-family: var(--font-display);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: var(--text-sm);
  color: var(--hb-orange);
  line-height: 1;
}

.hb-h1, h1.hb {
  font-family: var(--font-display);
  font-weight: 500;
  text-transform: uppercase;
  font-size: clamp(48px, 7vw, var(--text-6xl));
  line-height: 0.92;
  letter-spacing: -0.005em;
  color: var(--hb-black);
}

.hb-h2, h2.hb {
  font-family: var(--font-display);
  font-weight: 500;
  text-transform: uppercase;
  font-size: clamp(36px, 5vw, var(--text-4xl));
  line-height: 0.95;
  letter-spacing: 0;
  color: var(--hb-black);
}

.hb-h3, h3.hb {
  font-family: var(--font-display);
  font-weight: 500;
  text-transform: uppercase;
  font-size: var(--text-2xl);
  line-height: 1.02;
  color: var(--hb-black);
}

.hb-h4, h4.hb {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-xl);
  line-height: 1.1;
  color: var(--hb-black);
}

.hb-body, p.hb {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: var(--text-base);
  line-height: 1.5;
  color: var(--hb-ink);
  text-wrap: pretty;
}

.hb-body-lg {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: var(--text-md);
  line-height: 1.5;
  color: var(--hb-ink);
}

.hb-label {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-sm);
  line-height: 1.2;
  color: var(--hb-ink);
  letter-spacing: 0.01em;
}

.hb-caption {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: var(--text-xs);
  line-height: 1.35;
  color: var(--hb-gray);
}

.hb-price {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-3xl);
  color: var(--hb-black);
  letter-spacing: 0;
}

.hb-price-strike {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lg);
  color: var(--hb-gray);
  text-decoration: line-through;
}

html, body { font-family: var(--font-body); color: var(--hb-ink); background: var(--hb-cream); }

/* Web UI kit overrides for marketing site reproduction */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--hb-cream); color: var(--hb-ink); font-family: var(--font-body); }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* Marquee announcement bar */
.hb-marquee {
  background: #0b0707; color: #fff; font-family: var(--font-body);
  font-size: 13px; letter-spacing: .02em; padding: 10px 16px;
  display: flex; justify-content: center; align-items: center; gap: 8px;
}
.hb-marquee b { font-weight: 500; }

/* Header */
.hb-nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(250,249,246,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid #eae8e0;
  padding: 14px 32px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px;
}
.hb-nav .nav-left, .hb-nav .nav-right { display: flex; gap: 26px; align-items: center; }
.hb-nav .nav-right { justify-content: flex-end; }
.hb-nav a { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: #0b0707; transition: opacity 140ms; }
.hb-nav a:hover { opacity: .6; }
.hb-nav .logo img { height: 28px; }
.hb-icon-btn {
  background: transparent; border: none; cursor: pointer; padding: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  color: #0b0707;
}
.hb-cart-pill {
  display: inline-flex; align-items: center; gap: 6px; background: #0b0707; color: #fff;
  padding: 8px 14px; border-radius: 999px; font-family: var(--font-body); font-weight: 500; font-size: 13px;
  border: none; cursor: pointer;
}

/* Base button styles */
.hb-btn {
  font-family: var(--font-display); font-weight: 500; text-transform: uppercase;
  letter-spacing: .04em; font-size: 14px; border-radius: 999px;
  padding: 14px 28px; border: none; cursor: pointer; line-height: 1;
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform 140ms var(--ease-out), background 140ms var(--ease-out);
}
.hb-btn:active { transform: translateY(1px); }
.hb-btn-primary { background: #fa5000; color: #fff; }
.hb-btn-primary:hover { background: #e33e01; }
.hb-btn-dark { background: #0b0707; color: #fff; }
.hb-btn-dark:hover { background: #292929; }
.hb-btn-ghost { background: transparent; color: #0b0707; border: 1.5px solid #0b0707; }
.hb-btn-ghost:hover { background: #0b0707; color: #fff; }
.hb-btn-lg { padding: 18px 36px; font-size: 16px; }
.hb-btn-sm { padding: 10px 18px; font-size: 12px; }

/* Section scaffold */
.hb-section { padding: 80px 32px; }
.hb-container { max-width: 1280px; margin: 0 auto; }
.hb-h1 { font-family: var(--font-display); font-weight: 500; text-transform: uppercase; font-size: clamp(48px, 7vw, 96px); line-height: .92; color: #0b0707; margin: 0; }
.hb-h2 { font-family: var(--font-display); font-weight: 500; text-transform: uppercase; font-size: clamp(36px, 5vw, 56px); line-height: .95; color: #0b0707; margin: 0; }
.hb-h3 { font-family: var(--font-display); font-weight: 500; text-transform: uppercase; font-size: 32px; line-height: 1.02; color: #0b0707; margin: 0; }
.hb-eyebrow { font-family: var(--font-display); font-weight: 500; text-transform: uppercase; font-size: 13px; color: #fa5000; letter-spacing: .08em; line-height: 1; }
.hb-lead { font-family: var(--font-body); font-size: 18px; line-height: 1.5; color: #292929; max-width: 60ch; text-wrap: pretty; }

@keyframes hb-marquee { from { transform: translateX(0) } to { transform: translateX(-33.333%) } }

/* ===== GSSI Section Styles ===== */
body { font-family: var(--font-body); color: var(--hb-ink); -webkit-font-smoothing: antialiased; }

  .section {
    max-width: 1280px;
    margin: 0 auto;
    padding: var(--space-24) var(--space-8);
  }

  /* ---------- Header ---------- */
  .head {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: var(--space-16);
    align-items: end;
    margin-bottom: var(--space-16);
  }
  .head__left .eyebrow {
    font-family: var(--font-display);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: var(--text-sm);
    color: var(--hb-orange);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: var(--space-6);
  }
  .eyebrow::before {
    content: "";
    width: 22px;
    height: 1.5px;
    background: var(--hb-orange);
    display: inline-block;
  }
  .head h2 {
    font-family: var(--font-display);
    font-weight: 500;
    text-transform: uppercase;
    font-size: clamp(44px, 5.4vw, 84px);
    line-height: 0.92;
    letter-spacing: -0.005em;
    color: var(--hb-black);
    margin: 0;
  }
  .head__right {
    padding-bottom: 6px;
  }
  .head__right p {
    font-family: var(--font-body);
    font-size: var(--text-md);
    line-height: 1.5;
    color: var(--hb-ink);
    margin: 0 0 var(--space-6) 0;
    max-width: 46ch;
  }
  .accreditation {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 8px 10px;
    background: rgba(11, 7, 7, 0.045);
    border-radius: var(--radius-pill);
    font-size: var(--text-sm);
    color: var(--hb-ink-soft);
    border: 1px solid rgba(11, 7, 7, 0.08);
  }
  .accreditation strong { color: var(--hb-black); font-weight: 500; }
  .accreditation .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--hb-success);
    box-shadow: 0 0 0 3px rgba(33, 150, 83, 0.18);
  }

  /* ---------- Stats strip ---------- */
  .stats {
    margin-top: var(--space-12);
    border-top: 1px solid rgba(11, 7, 7, 0.12);
    border-bottom: 1px solid rgba(11, 7, 7, 0.12);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .stat {
    padding: var(--space-8) var(--space-6);
    border-right: 1px solid rgba(11, 7, 7, 0.12);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stat:last-child { border-right: 0; }
  .stat__num {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(48px, 5.2vw, 72px);
    line-height: 0.9;
    letter-spacing: -0.01em;
    color: var(--hb-black);
  }
  .stat__num sup {
    font-size: 0.5em;
    vertical-align: top;
    color: var(--hb-orange);
    margin-left: 2px;
    font-weight: 500;
    top: 0.2em;
    position: relative;
  }
  .stat__label {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    line-height: 1.35;
    color: var(--hb-ink-soft);
    max-width: 22ch;
  }

  /* ---------- Featured researcher panel ---------- */
  .featured {
    margin-top: var(--space-16);
    background: var(--hb-black);
    color: var(--hb-white);
    border-radius: var(--radius-2xl);
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
    min-height: 380px;
  }
  .featured__media {
    position: relative;
    background:
      radial-gradient(120% 80% at 30% 30%, rgba(250, 80, 0, 0.18), transparent 60%),
      linear-gradient(160deg, #1a1414 0%, #0b0707 70%);
    display: flex;
    align-items: flex-end;
    padding: var(--space-6);
  }
  .featured__media::before {
    /* Placeholder lab "photograph" — abstract composition */
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 22% 38%, rgba(255,255,255,0.06) 0 1px, transparent 1.5px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.05) 0 1px, transparent 1.5px),
      radial-gradient(circle at 45% 75%, rgba(255,255,255,0.04) 0 1px, transparent 1.5px);
    background-size: 14px 14px, 18px 18px, 22px 22px;
    opacity: 0.6;
    pointer-events: none;
  }
  .featured__media::after {
    /* Glassware silhouette */
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -55%);
    width: 180px; height: 260px;
    background:
      linear-gradient(180deg, rgba(250,80,0,0.0) 0 35%, rgba(250,80,0,0.55) 35% 90%, rgba(250,80,0,0.65) 90% 100%);
    clip-path: polygon(28% 0, 72% 0, 72% 18%, 92% 100%, 8% 100%, 28% 18%);
    filter: blur(0.4px);
    opacity: 0.85;
  }
  .featured__caption {
    position: relative;
    z-index: 1;
    font-family: var(--font-body);
    font-size: var(--text-xs);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .featured__caption .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--hb-orange);
    box-shadow: 0 0 0 3px rgba(250,80,0,0.25);
  }

  .featured__body {
    padding: var(--space-12) var(--space-12);
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
    justify-content: center;
  }
  .featured__tag {
    align-self: flex-start;
    font-family: var(--font-display);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: var(--text-xs);
    color: var(--hb-orange);
    padding: 6px 12px;
    border: 1px solid rgba(250, 80, 0, 0.5);
    border-radius: var(--radius-pill);
  }
  .featured__quote {
    font-family: var(--font-display);
    font-weight: 500;
    text-transform: uppercase;
    font-size: clamp(24px, 2.4vw, 34px);
    line-height: 1.05;
    letter-spacing: -0.005em;
    color: var(--hb-white);
    margin: 0;
  }
  .featured__quote em {
    color: var(--hb-orange);
    font-style: normal;
  }
  .featured__attribution {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding-top: var(--space-3);
    border-top: 1px solid rgba(255,255,255,0.12);
    margin-top: var(--space-3);
  }
  .featured__avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 38%, #cdb8a9 0 28%, transparent 29%),
      radial-gradient(circle at 50% 100%, #cdb8a9 0 36%, transparent 36%),
      linear-gradient(180deg, #2b2424, #1a1414);
    border: 1.5px solid rgba(255,255,255,0.16);
    flex: 0 0 auto;
  }
  .featured__name {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    color: var(--hb-white);
    font-weight: 500;
    line-height: 1.3;
  }
  .featured__role {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    color: rgba(255,255,255,0.55);
    line-height: 1.3;
  }

  /* ---------- Findings ---------- */
  .findings-title {
    margin: var(--space-16) 0 var(--space-6) 0;
    font-family: var(--font-display);
    font-weight: 500;
    text-transform: uppercase;
    font-size: var(--text-2xl);
    color: var(--hb-black);
    letter-spacing: 0;
  }
  .findings {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-5);
  }
  .finding {
    background: var(--hb-white);
    border-radius: var(--radius-xl);
    border: 1px solid rgba(11, 7, 7, 0.06);
    padding: var(--space-8);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    box-shadow: 0 1px 0 rgba(11,7,7,0.02);
  }
  .finding__icon {
    width: 56px; height: 56px;
    border-radius: var(--radius-md);
    background: var(--hb-orange-50);
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .finding__icon img { width: 28px; height: 28px; display: block; }
  .finding__hero {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(40px, 4vw, 56px);
    line-height: 0.92;
    letter-spacing: -0.01em;
    color: var(--hb-black);
  }
  .finding__hero .unit {
    font-size: 0.55em;
    color: var(--hb-orange);
    margin-left: 2px;
  }
  .finding__claim {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: var(--text-md);
    line-height: 1.35;
    color: var(--hb-black);
    margin: 0;
  }
  .finding__body {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    line-height: 1.5;
    color: var(--hb-ink-soft);
    margin: 0;
  }
  .finding__cite {
    margin-top: auto;
    padding-top: var(--space-4);
    border-top: 1px dashed rgba(11, 7, 7, 0.14);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }
  .finding__cite span {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    line-height: 1.35;
    color: var(--hb-gray);
  }
  .finding__cite a {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    font-weight: 500;
    color: var(--hb-black);
    text-decoration: none;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: opacity var(--dur-med) var(--ease-out);
  }
  .finding__cite a:hover { opacity: 0.6; }
  .finding__cite a::after {
    content: "↗";
    font-size: 12px;
    color: var(--hb-orange);
  }

  /* ---------- Journals / partners strip ---------- */
  .journals {
    margin-top: var(--space-16);
    padding-top: var(--space-10);
    border-top: 1px solid rgba(11, 7, 7, 0.12);
    display: grid;
    grid-template-columns: minmax(0, 0.7fr) minmax(0, 2fr);
    gap: var(--space-12);
    align-items: center;
  }
  .journals__label {
    font-family: var(--font-display);
    font-weight: 500;
    text-transform: uppercase;
    font-size: var(--text-sm);
    letter-spacing: 0.08em;
    color: var(--hb-ink-soft);
    line-height: 1.3;
  }
  .journals__label strong { color: var(--hb-black); display: block; font-size: var(--text-md); margin-top: 2px; }
  .journals__list {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-6);
    align-items: center;
  }
  .journal {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-left: var(--space-4);
    border-left: 1.5px solid var(--hb-orange);
  }
  .journal__name {
    font-family: var(--font-display);
    font-weight: 500;
    text-transform: uppercase;
    font-size: var(--text-sm);
    line-height: 1.05;
    letter-spacing: 0.02em;
    color: var(--hb-black);
  }
  .journal__meta {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    color: var(--hb-gray);
  }

  /* ---------- Footnote / CTA row ---------- */
  .foot {
    margin-top: var(--space-10);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-6);
    flex-wrap: wrap;
  }
  .foot__note {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    color: var(--hb-gray);
    max-width: 60ch;
    line-height: 1.5;
  }
  .btn-secondary {
    font-family: var(--font-display);
    font-weight: 500;
    text-transform: uppercase;
    font-size: var(--text-sm);
    letter-spacing: 0.04em;
    color: var(--hb-black);
    background: transparent;
    border: 1.5px solid var(--hb-black);
    border-radius: var(--radius-pill);
    padding: 12px 22px;
    cursor: pointer;
    transition: background var(--dur-med) var(--ease-out), color var(--dur-med) var(--ease-out);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-secondary:hover { background: var(--hb-black); color: var(--hb-white); }
  .btn-secondary::after { content: "→"; }

  /* ---------- Responsive ---------- */
  @media (max-width: 960px) {
    .head { grid-template-columns: 1fr; align-items: start; }
    .head__right { padding-bottom: 0; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid rgba(11,7,7,0.12); }
    .featured { grid-template-columns: 1fr; }
    .featured__media { min-height: 220px; }
    .findings { grid-template-columns: 1fr; }
    .journals { grid-template-columns: 1fr; }
    .journals__list { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
